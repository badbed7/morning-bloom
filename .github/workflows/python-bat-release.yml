name: Python BAT release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/python-bat-release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag; empty uses release/VERSION
        required: false
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package exact release source
        id: package
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [[ -z "$tag" ]]; then
            version="$(tr -d '\r\n ' < release/VERSION)"
            tag="v$version"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null
          root="MorningBloom-$version-Python-BAT"
          asset="$root.zip"
          git archive --format=zip --prefix="$root/" -o "$asset" "$tag" -- \
            run-python.bat python assets/fonts README.md
          unzip -t "$asset"
          entries="$(unzip -Z1 "$asset")"
          for required in \
            "$root/run-python.bat" \
            "$root/python/requirements.txt" \
            "$root/python/morning_bloom/__main__.py" \
            "$root/assets/fonts/NotoSansKR-Subset.otf"; do
            grep -Fxq "$required" <<< "$entries"
          done
          if grep -Eq '(__pycache__|\.venv|\.pyc$)' <<< "$entries"; then
            echo 'Generated files were included in the archive.' >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload ZIP to existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.package.outputs.tag }}" >/dev/null
          gh release upload "${{ steps.package.outputs.tag }}" \
            "${{ steps.package.outputs.asset }}" --clobber

