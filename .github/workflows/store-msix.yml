name: Store MSIX package
on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: Partner Center Product identity의 Name
        required: true
        type: string
      publisher:
        description: Partner Center Product identity의 Publisher
        required: true
        type: string
      publisher_display_name:
        description: Partner Center Product identity의 Publisher display name
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: store-msix
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r python/requirements.txt -r release/requirements-build.txt
      - name: Test game
        run: python -m unittest discover -s python/tests -v
        env:
          PYTHONPATH: python
          QT_QPA_PLATFORM: offscreen
      - name: Test packaging
        run: python -m unittest discover -s release/tests -v
        env:
          PYTHONPATH: release
      - name: Build native game
        run: python release/build_windows.py
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      - name: Create unsigned Store submission package
        run: python release/build_msix.py
        env:
          STORE_IDENTITY_NAME: ${{ inputs.identity_name }}
          STORE_PUBLISHER: ${{ inputs.publisher }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: MorningBloom-Store-MSIX
          path: release-output/*-Store-x64.msix
          if-no-files-found: error
          retention-days: 14
