name: Godot checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl --fail --location --retry 3 https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip --output /tmp/godot.zip
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Import project
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import
      - name: State and storage tests
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/test_runner.gd
      - name: Main scene smoke test
        run: Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/ui_smoke.gd -- --demo
