name: Windows release
on:
  push:
    branches: [main]
    paths: ['release/VERSION']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r python/requirements.txt -r release/requirements-build.txt
      - name: Test game
        run: python -m unittest discover -s python/tests -v
        env:
          PYTHONPATH: python
          QT_QPA_PLATFORM: offscreen
      - name: Test updater
        run: python -m unittest discover -s release/tests -v
        env:
          PYTHONPATH: release
      - name: Build and test native executables
        run: python release/build_windows.py
        env:
          BLOOM_RELEASE_REPO: ${{ github.repository }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      - name: Build and test Python BAT package
        run: python release/build_python.py
        env:
          BLOOM_RELEASE_REPO: ${{ github.repository }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: MorningBloom-Windows
          path: release-output/*
          retention-days: 14
      - name: Publish release in source repository
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $version = (Get-Content release/VERSION -Raw).Trim()
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release already exists. Bump release/VERSION; existing releases are never overwritten." }
          gh release create $tag --target $env:RELEASE_COMMIT --title "Morning Bloom $version" --notes-file release-output/release-notes.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Could not create release' }
          gh release upload $tag release-output/*.zip release-output/update.json release-output/python-update.json
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
      - name: Check both public update feeds without credentials
        run: python -c "import os; from update_core import read_latest; expected=open('release/VERSION').read().strip(); assert all(read_latest(os.environ['BLOOM_RELEASE_REPO'], mode)['version'] == expected for mode in (False, True))"
        env:
          PYTHONPATH: release
          BLOOM_RELEASE_REPO: ${{ github.repository }}
